name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build-test:
    name: Build & test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache pinned standards artifacts
        uses: actions/cache@v4
        with:
          path: fixtures/_downloads
          key: artifacts-${{ hashFiles('tools/artifacts.manifest.json') }}
      - run: pnpm artifacts
      - run: pnpm build
      - run: pnpm test

  pdfa:
    name: Generated ZUGFeRD PDFs (veraPDF PDF/A-3b + Mustang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Cache pinned standards artifacts
        uses: actions/cache@v4
        with:
          path: fixtures/_downloads
          key: artifacts-${{ hashFiles('tools/artifacts.manifest.json') }}
      - run: pnpm artifacts
      - name: Install veraPDF (unattended)
        run: |
          curl -sSL -o /tmp/verapdf-installer.zip https://software.verapdf.org/rel/verapdf-installer.zip
          unzip -q /tmp/verapdf-installer.zip -d /tmp/verapdf-installer
          java -jar /tmp/verapdf-installer/verapdf-*/verapdf-izpack-installer-*.jar tools/verapdf-auto-install.xml
          /opt/verapdf/verapdf --version
      - run: pnpm build
      - run: pnpm check:zugferd
        env:
          VERAPDF: /opt/verapdf/verapdf
          KONTOR_JAVA: java

  conformance:
    name: Conformance gate (KoSIT oracle vs. Kontor engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether the engine or the rules changed
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "no base commit - running"; exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}" -- packages/core packages/rules tools/oracle.ts tools/conformance-report.ts tools/artifacts.manifest.json docs/conformance .github/workflows/ci.yml)
          if [ -n "$changed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "$changed"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "nothing relevant changed - skipping the Java oracle"; fi
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.run == 'true'
        name: Cache pinned standards artifacts
        uses: actions/cache@v4
        with:
          path: fixtures/_downloads
          key: artifacts-${{ hashFiles('tools/artifacts.manifest.json') }}
      - if: steps.scope.outputs.run == 'true'
        run: pnpm artifacts
      - if: steps.scope.outputs.run == 'true'
        run: pnpm build
      - if: steps.scope.outputs.run == 'true'
        name: Oracle diff over the full corpus (fresh report)
        run: pnpm oracle --diff --report /tmp/conformance-ci.json fixtures/spike fixtures/_downloads/xrechnung-testsuite/instances
      - if: always() && steps.scope.outputs.run == 'true'
        name: Gate - thresholds on the fresh run, parity with the committed report, docs/badge in sync
        run: pnpm conformance:check --against /tmp/conformance-ci.json
      - if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: /tmp/conformance-ci.json

  security:
    name: Security (audit, licences, sovereignty + hardening suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (runtime tree, high+)
        run: pnpm audit --prod --audit-level high
      - name: Licence inventory must match docs/LICENSES.md
        run: pnpm licenses:check
      - run: pnpm build
      - name: Sovereignty (no-network guard) and hardening suites
        run: |
          pnpm --filter @kontor-mcp/core exec vitest run test/sovereignty.test.ts
          pnpm --filter @kontor-mcp/server exec vitest run test/sovereignty.test.ts test/security.test.ts

  docker:
    name: Docker image (amd64+arm64 build, HTTP smoke via Inspector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build both platforms (no push; GHCR publish is owner-gated, Task 3.6)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kontor-mcp:ci
          cache-from: type=gha
      - name: Image size < 300 MB, runs as non-root, refuses to start without a token
        run: |
          size=$(docker image inspect kontor-mcp:ci --format '{{.Size}}')
          echo "image size: $((size / 1000000)) MB"
          test "$size" -lt 300000000
          test "$(docker run --rm --entrypoint id -u kontor-mcp:ci)" != "0"
          if docker run --rm kontor-mcp:ci; then echo "started without KONTOR_AUTH_TOKEN"; exit 1; fi
      - name: Run container and wait for the health check
        run: |
          docker run -d --name kontor -p 127.0.0.1:3333:3333 -e KONTOR_AUTH_TOKEN=ci-smoke-token-0123456789 kontor-mcp:ci
          for i in $(seq 1 30); do
            if [ "$(docker inspect kontor --format '{{.State.Health.Status}}')" = healthy ]; then break; fi
            sleep 1
          done
          docker inspect kontor --format 'health={{.State.Health.Status}}' | tee /dev/stderr | grep -q healthy
          curl -sf http://127.0.0.1:3333/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3333/mcp -H 'content-type: application/json' -d '{}')" = 401
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspector over HTTP with token — tools/list (8 tools) + validate_invoice on a bundled sample
        run: |
          H="Authorization: Bearer ci-smoke-token-0123456789"
          npx -y @modelcontextprotocol/inspector@latest --cli http://127.0.0.1:3333/mcp --transport http --header "$H" \
            --method tools/list > tools.json
          test "$(jq '.tools | length' tools.json)" = 8
          npx -y @modelcontextprotocol/inspector@latest --cli http://127.0.0.1:3333/mcp --transport http --header "$H" \
            --method tools/call --tool-name validate_invoice --tool-arg file_path=/app/samples/valid-xrechnung-ubl.xml > call.json
          jq -e '.structuredContent.verdict == "valid"' call.json
          npx -y @modelcontextprotocol/inspector@latest --cli http://127.0.0.1:3333/mcp --transport http --header "$H" \
            --method tools/call --tool-name validate_invoice --tool-arg file_path=/app/samples/broken-missing-buyer-reference.xml > broken.json
          jq -e '.structuredContent.verdict == "invalid"' broken.json
      - name: Full audit inside a container with NO network at all (stdio, --network none)
        run: |
          npx -y @modelcontextprotocol/inspector@latest --cli sh tools/docker-stdio-offline.sh kontor-mcp:ci \
            --method tools/call --tool-name audit_invoice --tool-arg file_path=/app/samples/valid-zugferd-en16931.pdf > offline.json
          jq -e '.structuredContent.recommendation == "accept"' offline.json
      - name: Graceful shutdown on SIGTERM
        if: always()
        run: |
          docker stop -t 10 kontor
          docker logs kontor 2>&1 | tail -5
          docker rm kontor
